name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Run editor tests
        run: bun run test

      - name: Build app and registry
        run: bun run build

      - name: Verify committed registry artifacts
        run: git diff --exit-code public/r

      - name: Smoke test registry install
        run: bun run registry:smoke
