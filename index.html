<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pytah — Composable Lexical Editor for React</title>
    <meta
      name="description"
      content="A composable, copy-paste ready Lexical rich text editor built with shadcn/ui, Base UI, and Tailwind CSS v4 with lossless Markdown and HTML workflows."
    />
    <meta
      property="og:title"
      content="Pytah — Composable Lexical Editor for React"
    />
    <meta
      property="og:description"
      content="A composable, copy-paste ready Lexical rich text editor built with shadcn/ui, Base UI, and Tailwind CSS v4 with lossless Markdown and HTML workflows."
    />
    <meta property="og:type" content="website" />
    <script>
      "use strict";
      (() => {
        try {
          const stored = localStorage.getItem("pytah-theme");
          const isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch {
          // ignore localStorage access errors
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
